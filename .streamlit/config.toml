# El tema oscuro lo pone app.py (TEMA) también en el ejecutable; esto es para desarrollo.
[theme]
base = "dark"
primaryColor = "#7CC496"
backgroundColor = "#131517"
secondaryBackgroundColor = "#1D2124"
textColor = "#ECEFF1"
linkColor = "#7CC496"

[server]
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false
