# El tema oscuro lo pone app.py (TEMA) también en el ejecutable; esto es para desarrollo.
[theme]
base = "dark"
primaryColor = "#7CC496"
backgroundColor = "#221F20"
secondaryBackgroundColor = "#2E2A2B"
textColor = "#ECEFF1"
linkColor = "#7CC496"

[server]
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false
