name: Compilar ejecutables standalone

# Genera los ejecutables para Windows y Linux y prueba el instalador de Mac. La app se
# abre en su propia ventana (pywebview; desde el 26-11-2026), y la compilación comprueba
# en Windows y Mac que se ve en ella.
#
#   · macOS (27-11-2026): ya no hay ejecutable de PyInstaller, sino un instalador como
#     los de MonitorEO y eHabitat+ (instalador/macos/instalar.command, trabajo «macos»).
#   · Con una etiqueta v* (p. ej. v1.0.3), si los tres sistemas salen bien, crea la
#     Release con los tres archivos COMO BORRADOR (26-11-2026): solo la ven quienes
#     tienen permiso en el repositorio, y Zenodo no archiva los borradores (no hay
#     DOI). Para hacerla pública: Releases → la versión → Edit → «Publish release»;
#     en ese momento, si Zenodo está conectado, se crea el DOI (ver PUBLICAR.md).
#   · También se puede lanzar a mano desde la pestaña «Actions» (workflow_dispatch)
#     para probar sin publicar nada.

on:
  push:
    tags:
      - 'v*'         # versión real: compila y crea la Release como borrador
      - 'prueba-*'   # ensayo: compila pero NO crea Release. El sufijo elige el
                     # sistema, p. ej. 'prueba-macos-arm' compila solo ese.
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Qué sistema compilar (para probar sin esperar a los cuatro)'
        type: choice
        default: todas
        options:
          - todas
          - windows
          - macos-arm
          - macos-intel
          - linux

permissions:
  contents: write        # necesario para adjuntar los binarios a la Release

jobs:
  # Decide qué sistemas se compilan. Al publicar una etiqueta se compilan siempre
  # los cuatro; al lanzarlo a mano se puede elegir uno solo para probar más rápido.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}       # Windows y Linux (PyInstaller)
      compilar: ${{ steps.elegir.outputs.compilar }}   # 'true' si hay alguno
      mac: ${{ steps.elegir.outputs.mac }}             # máquina del instalador de Mac, o ''
    steps:
      - id: elegir
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sistemas = {
            'windows':     {'os': 'windows-latest', 'nombre': 'Windows x64',
                            'artefacto': 'Borreguil-windows'},
            # glibc antigua = compatible con más distribuciones
            'linux':       {'os': 'ubuntu-22.04',   'nombre': 'Linux x64',
                            'artefacto': 'Borreguil-linux'},
          }
          # El instalador de Mac sirve para Apple Silicon e Intel: se prueba en una
          # máquina Apple Silicon. OJO: los runners Intel de macOS son escasos (un
          # trabajo encolado ahí puede esperar horas y caducar), así que Intel NO entra
          # en 'todas': se prueba solo si se pide expresamente.
          macs = {'macos-arm': 'macos-latest', 'macos-intel': 'macos-15-intel'}
          elegida = (os.environ.get('ELEGIDA') or '').strip()
          # Etiqueta de ensayo 'prueba-<sistema>': el sufijo indica qué compilar.
          ref = os.environ.get('REF', '')
          marca = 'refs/tags/prueba-'
          if not elegida and ref.startswith(marca):
              elegida = ref[len(marca):]
          if elegida not in sistemas and elegida not in macs:
              elegida = 'todas'
          if elegida == 'todas':
              incluir, mac = list(sistemas.values()), macs['macos-arm']
          elif elegida in macs:
              incluir, mac = [], macs[elegida]
          else:
              incluir, mac = [sistemas[elegida]], ''
          # Solo las líneas 'clave=valor' pueden ir a GITHUB_OUTPUT; el resto, al log.
          print(f'Seleccion: {elegida} -> '
                + ', '.join([i['nombre'] for i in incluir] + ([f'instalador de Mac ({mac})']
                                                              if mac else [])),
                file=sys.stderr)
          print('matriz=' + json.dumps({'include': incluir}))
          print('compilar=' + ('true' if incluir else 'false'))
          print('mac=' + mac)
          PY
        env:
          ELEGIDA: ${{ github.event_name == 'workflow_dispatch' && inputs.plataforma || '' }}
          REF: ${{ github.ref }}

  build:
    needs: preparar
    if: needs.preparar.outputs.compilar == 'true'
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    # Sin este límite, un paso colgado consume el máximo de 6 h de GitHub antes de
    # darse por vencido. Con 75 min, si algo se atasca falla pronto y se ve el log.
    timeout-minutes: 75
    strategy:
      fail-fast: false   # que un sistema falle no debe cancelar los demás
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # mejor disponibilidad de wheels geoespaciales
          cache: pip

      - name: Instalar dependencias
        shell: bash
        timeout-minutes: 30      # si un paquete se compila desde el código, no eternizarlo
        run: |
          python -m pip install --upgrade pip wheel
          # requirements.txt fija la versión EXACTA de scikit-learn con la que se
          # guardaron los modelos .joblib: si no coincide, al cargarlos las
          # predicciones pueden ser inválidas (aviso InconsistentVersionWarning).
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Comprobar que los modelos cargan sin aviso de versión
        shell: bash
        run: |
          python - <<'PY'
          import warnings, sys, glob
          from sklearn.exceptions import InconsistentVersionWarning
          fallos = []
          for f in sorted(glob.glob('*.joblib')):
              with warnings.catch_warnings(record=True) as w:
                  warnings.simplefilter('always')
                  import joblib; joblib.load(f)
                  if [x for x in w if issubclass(x.category, InconsistentVersionWarning)]:
                      fallos.append(f)
              print(('AVISO DE VERSION  ' if f in fallos else 'ok                ') + f)
          if fallos:
              sys.exit('ERROR: modelos incompatibles con esta scikit-learn: ' + ', '.join(fallos))
          PY

      - name: Compilar con PyInstaller
        shell: bash
        timeout-minutes: 30
        run: pyinstaller borreguil.spec --noconfirm --distpath dist --workpath build

      # Comprueba DENTRO del ejecutable que no falta ninguna dependencia ni recurso.
      # Imprescindible: el servidor web devuelve 200 aunque el script de la app
      # falle, así que una simple comprobación HTTP daría por bueno un binario roto.
      - name: Autodiagnóstico del ejecutable
        shell: bash
        timeout-minutes: 10
        run: |
          cd dist/Borreguil
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=./Borreguil.exe; else EXE=./Borreguil; fi
          "$EXE" --selftest
          # La misma comprobación que hace el actualizador con una versión nueva del
          # código descargada (actualizador.py): el código de una carpeta, cargado por
          # delante del que viaja dentro del ejecutable.
          mkdir -p ../codigo_prueba
          cp _internal/*.py _internal/*.joblib _internal/CITATION.cff ../codigo_prueba/
          "$EXE" --probar-codigo ../codigo_prueba

      - name: Comprobar que arranca y sirve la interfaz
        shell: bash
        timeout-minutes: 10
        env:
          BORREGUIL_NO_BROWSER: '1'
          # Se prueba el código que trae el ejecutable, no el publicado en GitHub.
          BORREGUIL_CODIGO_URL: ''
        run: |
          cd dist/Borreguil
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=./Borreguil.exe; else EXE=./Borreguil; fi
          # La salida va a un fichero y la entrada se cierra: si el proceso en
          # segundo plano conservara la tubería del runner, el paso no terminaría
          # nunca y agotaría el tiempo máximo del trabajo.
          "$EXE" < /dev/null > salida.log 2>&1 &
          PID=$!
          CODE=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:8501/_stcore/health || true)
            [ "$CODE" = "200" ] && break
            kill -0 $PID 2>/dev/null || { echo "El programa terminó antes de tiempo"; break; }
            sleep 3
          done
          echo "----- salida del programa -----"; cat salida.log || true
          # Matar el proceso y cualquier hijo que haya podido dejar vivo.
          kill -9 $PID 2>/dev/null || true
          pkill -9 -f Borreguil 2>/dev/null || true
          taskkill //F //IM Borreguil.exe 2>/dev/null || true
          if [ "$CODE" != "200" ]; then echo "ERROR: el servidor no respondió (HTTP $CODE)"; exit 1; fi
          if grep -qiE "traceback|ModuleNotFoundError|ImportError" salida.log; then
            echo "ERROR: se detectaron errores en el arranque (ver salida arriba)"; exit 1
          fi
          echo "OK: el servidor respondió y no hubo errores"

      - name: Empaquetar (zip / tar.gz)
        shell: bash
        run: |
          cd dist
          rm -f Borreguil/salida.log
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf "../${{ matrix.artefacto }}.tar.gz" Borreguil
          else
            7z a -tzip "../${{ matrix.artefacto }}.zip" Borreguil >/dev/null || \
              (command -v zip >/dev/null && zip -qr "../${{ matrix.artefacto }}.zip" Borreguil)
          fi

      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: |
            ${{ matrix.artefacto }}.zip
            ${{ matrix.artefacto }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # La ventana propia (pywebview): se abre, se espera a que la app se vea dentro (el
      # panel lateral) y se cierra. Va después de guardar el artefacto, para que haya
      # descarga aunque falle, y antes de la Release, para no publicar un programa cuya
      # ventana no funciona. En Linux no: el runner no tiene pantalla, y allí el programa
      # abre el navegador si no hay GTK ni Qt. (En Mac, en el trabajo «macos».)
      - name: Comprobar que la app se abre en su ventana
        if: runner.os != 'Linux'
        shell: bash
        timeout-minutes: 8
        env:
          BORREGUIL_CODIGO_URL: ''
        run: |
          cd dist/Borreguil
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=./Borreguil.exe; else EXE=./Borreguil; fi
          "$EXE" --probar-ventana < /dev/null

  # macOS (27-11-2026): el instalador, como los de MonitorEO y eHabitat+
  # (instalador/macos/instalar.command): micromamba y el entorno de environment.yml en
  # ~/Borreguil, y la app «Borreguil» en el Escritorio. Esa app la crea el propio Mac, así
  # que no está en cuarentena y macOS la abre sin avisos (ya no hacen falta xattr ni
  # «Abrir igualmente»), y el mismo instalador vale para Apple Silicon e Intel. Aquí se
  # ejecuta el instalador de esta copia del repositorio (instala su código, no el
  # publicado), se prueba lo mismo que en los ejecutables, con la app que deja en el
  # Escritorio, y se guarda en Borreguil-macos.zip como «Instalar Borreguil.command», con
  # permiso de ejecución, para la Release.
  macos:
    needs: preparar
    if: needs.preparar.outputs.mac != ''
    name: macOS (instalador)
    runs-on: ${{ needs.preparar.outputs.mac }}
    timeout-minutes: 60
    env:
      ESCRITORIO: ${{ github.workspace }}/../Escritorio
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Comprobar el instalador
        shell: bash
        run: |
          /bin/bash -n instalador/macos/instalar.command
          test -x instalador/macos/instalar.command

      - name: Instalar con el instalador de Mac
        shell: bash
        timeout-minutes: 40
        env:
          BORREGUIL_ESCRITORIO: ${{ env.ESCRITORIO }}   # sin tocar el Escritorio de la máquina
          BORREGUIL_NO_ABRIR: '1'
        # /bin/bash: el de macOS (3.2), el que usan los usuarios; el bash de PATH puede ser otro.
        run: /bin/bash instalador/macos/instalar.command < /dev/null

      - name: Comprobar lo que ha instalado
        shell: bash
        env:
          BORREGUIL_ESCRITORIO: ${{ env.ESCRITORIO }}
          BORREGUIL_NO_ABRIR: '1'
        run: |
          APP="$ESCRITORIO/Borreguil.app"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/borreguil"
          cat "$APP/Contents/MacOS/borreguil"
          file "$APP/Contents/Resources/borreguil.icns" | grep -q 'Mac OS X icon'
          du -sh ~/Borreguil/entorno ~/Borreguil/micromamba ~/Borreguil/programa
          # La misma comprobación que hace el actualizador con una versión nueva del
          # código descargada: el código de otra carpeta, por delante del instalado.
          mkdir -p ../codigo_prueba
          cp ~/Borreguil/programa/*.py ~/Borreguil/programa/*.joblib ~/Borreguil/programa/CITATION.cff ../codigo_prueba/
          PYTHONNOUSERSITE=1 ~/Borreguil/entorno/bin/python -s ~/Borreguil/programa/launcher.py \
            --probar-codigo "$PWD/../codigo_prueba"
          # Otra vez: encuentra el entorno, no lo reinstala y solo pone al día el código y la app.
          /bin/bash instalador/macos/instalar.command < /dev/null | tee ../segunda.log
          grep -q 'El entorno de Python ya está instalado' ../segunda.log

      - name: Comprobar que arranca y sirve la interfaz
        shell: bash
        timeout-minutes: 10
        env:
          BORREGUIL_NO_BROWSER: '1'
          # Se prueba el código instalado, no el publicado en GitHub.
          BORREGUIL_CODIGO_URL: ''
        run: |
          rm -f ~/Borreguil/salida.log
          # El guion de la app del Escritorio, como al abrirla (lo que escribe va a salida.log).
          "$ESCRITORIO/Borreguil.app/Contents/MacOS/borreguil" < /dev/null &
          PID=$!
          CODE=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:8501/_stcore/health || true)
            [ "$CODE" = "200" ] && break
            kill -0 $PID 2>/dev/null || { echo "El programa terminó antes de tiempo"; break; }
            sleep 3
          done
          echo "----- salida del programa -----"; cat ~/Borreguil/salida.log || true
          kill -9 $PID 2>/dev/null || true
          pkill -9 -f "Borreguil/programa/launcher.py" 2>/dev/null || true
          if [ "$CODE" != "200" ]; then echo "ERROR: el servidor no respondió (HTTP $CODE)"; exit 1; fi
          if grep -qiE "traceback|ModuleNotFoundError|ImportError" ~/Borreguil/salida.log; then
            echo "ERROR: se detectaron errores en el arranque (ver salida arriba)"; exit 1
          fi
          echo "OK: el servidor respondió y no hubo errores"

      - name: Empaquetar el instalador (zip)
        shell: bash
        run: |
          mkdir -p ../mac
          install -m 755 instalador/macos/instalar.command "../mac/Instalar Borreguil.command"
          (cd ../mac && zip -X "$GITHUB_WORKSPACE/Borreguil-macos.zip" "Instalar Borreguil.command")
          unzip -Z Borreguil-macos.zip | grep -q -- '-rwx'

      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Borreguil-macos
          path: Borreguil-macos.zip
          if-no-files-found: error
          retention-days: 30

      # La app del Escritorio abierta como con un doble clic (open): su ventana se abre,
      # se espera a que la app se vea dentro y se cierra.
      - name: Comprobar que la app del Escritorio se abre en su ventana
        shell: bash
        timeout-minutes: 8
        run: |
          rm -f ~/Borreguil/salida.log
          open -W -n --env BORREGUIL_CODIGO_URL "$ESCRITORIO/Borreguil.app" --args --probar-ventana
          echo "----- salida del programa -----"; cat ~/Borreguil/salida.log || true
          grep -q 'Prueba de la ventana: ok' ~/Borreguil/salida.log

      # Lo que hace quien pega la línea del TUTORIAL: el instalador, fuera de una copia del
      # repositorio, instala el código publicado (el commit de codigo.json de main) con su
      # environment.yml o, si no lo trae, el de main. Va el último porque cambia el código
      # instalado por el publicado (y, si su lista de librerías es otra, reinstala el entorno).
      - name: Instalar el código publicado, como quien pega la línea
        shell: bash
        timeout-minutes: 40
        env:
          BORREGUIL_ESCRITORIO: ${{ env.ESCRITORIO }}
          BORREGUIL_NO_ABRIR: '1'
        run: |
          cp instalador/macos/instalar.command "$RUNNER_TEMP/instalar.command"
          /bin/bash "$RUNNER_TEMP/instalar.command" < /dev/null
          PUBLICADA=$(curl -fsSL https://raw.githubusercontent.com/monitoreo-obsnev/borreguil-detector/main/codigo.json |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          echo "Versión publicada: $PUBLICADA"
          grep -E '^version:' ~/Borreguil/programa/CITATION.cff
          grep -qE "^version: *\"?$PUBLICADA\"?([[:space:]]|\$)" ~/Borreguil/programa/CITATION.cff

  # La Release: un solo trabajo al final, con los archivos de los tres sistemas, y solo
  # si los tres han salido bien (incluida la prueba de la ventana); si alguno falla, no
  # se crea. Va COMO BORRADOR: la ven quienes tienen permiso en el repositorio (para
  # descargarla y probarla) y Zenodo no la archiva. Se hace pública a mano con
  # «Publish release», y solo entonces, si Zenodo está conectado, hay DOI.
  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Traer los archivos de los tres sistemas
        uses: actions/download-artifact@v4
        with:
          path: entrega
          merge-multiple: true

      - name: Crear la Release como borrador
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: entrega/*
          fail_on_unmatched_files: true
          body: |
            ## Descargas

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 | `Borreguil-windows.zip` |
            | macOS (Apple Silicon e Intel) | `Borreguil-macos.zip`, el instalador (mejor: el comando de abajo) |
            | Linux x86-64 | `Borreguil-linux.tar.gz` |

            Windows y Linux: no requieren instalar Python ni ninguna librería; se descomprimen y se ejecutan.

            **macOS**: abre la app **Terminal**, pega esta línea y pulsa Intro:

            ```bash
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/monitoreo-obsnev/borreguil-detector/main/instalador/macos/instalar.command)"
            ```

            Instala en `~/Borreguil`, sin permisos de administrador, Python y lo que necesita la app,
            y deja la app **Borreguil** en el Escritorio (como los instaladores de MonitorEO y eHabitat+).
            Con `Borreguil-macos.zip` es lo mismo con doble clic en «Instalar Borreguil.command», pero
            la primera vez macOS pide permiso en Ajustes del Sistema → Privacidad y seguridad.

            La app se abre en su propia ventana; con `Borreguil --navegador`, en el navegador.
            Consulta el **TUTORIAL.md** (2.2) para los primeros pasos y el **MANUAL.md** como referencia.
            Al abrirse, el programa se actualiza solo con la última versión de la app.

            > La primera vez, Windows avisa de que el programa no está firmado (es normal en
            > software científico): «Más información» → «Ejecutar de todas formas».
