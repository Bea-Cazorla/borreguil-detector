name: Compilar ejecutables standalone

# Genera los ejecutables para Windows, macOS (Intel y Apple Silicon) y Linux.
#
#   · Al publicar una etiqueta v* (p. ej. v1.0.0) los adjunta a la Release, que es
#     lo que Zenodo archiva para asignar el DOI.
#   · También se puede lanzar a mano desde la pestaña «Actions» (workflow_dispatch)
#     para probar sin publicar nada.

on:
  push:
    tags:
      - 'v*'         # versión real: compila y publica la Release (Zenodo -> DOI)
      - 'prueba-*'   # ensayo: compila pero NO crea Release. El sufijo elige el
                     # sistema, p. ej. 'prueba-macos-arm' compila solo ese.
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Qué sistema compilar (para probar sin esperar a los cuatro)'
        type: choice
        default: todas
        options:
          - todas
          - windows
          - macos-arm
          - macos-intel
          - linux

permissions:
  contents: write        # necesario para adjuntar los binarios a la Release

jobs:
  # Decide qué sistemas se compilan. Al publicar una etiqueta se compilan siempre
  # los cuatro; al lanzarlo a mano se puede elegir uno solo para probar más rápido.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}
    steps:
      - id: elegir
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sistemas = {
            'windows':     {'os': 'windows-latest', 'nombre': 'Windows x64',
                            'artefacto': 'Borreguil-windows'},
            'macos-arm':   {'os': 'macos-latest',   'nombre': 'macOS Apple Silicon',
                            'artefacto': 'Borreguil-macos-arm64'},
            # OJO: los runners Intel de macOS son escasos y las imágenes antiguas
            # (macos-13) están retiradas: un trabajo encolado ahí espera horas y
            # acaba caducando. Por eso Intel NO entra en 'todas': se compila solo
            # si se pide expresamente.
            'macos-intel': {'os': 'macos-15-intel', 'nombre': 'macOS Intel',
                            'artefacto': 'Borreguil-macos-intel'},
            # glibc antigua = compatible con más distribuciones
            'linux':       {'os': 'ubuntu-22.04',   'nombre': 'Linux x64',
                            'artefacto': 'Borreguil-linux'},
          }
          elegida = (os.environ.get('ELEGIDA') or '').strip()
          # Etiqueta de ensayo 'prueba-<sistema>': el sufijo indica qué compilar.
          ref = os.environ.get('REF', '')
          marca = 'refs/tags/prueba-'
          if not elegida and ref.startswith(marca):
              elegida = ref[len(marca):]
          if elegida not in sistemas:
              elegida = 'todas'
          if elegida == 'todas':
              incluir = [v for k, v in sistemas.items() if k != 'macos-intel']
          else:
              incluir = [sistemas[elegida]]
          # Solo la línea 'matriz=' puede ir a GITHUB_OUTPUT; el resto, al log.
          print(f'Seleccion: {elegida} -> ' + ', '.join(i['nombre'] for i in incluir),
                file=sys.stderr)
          print('matriz=' + json.dumps({'include': incluir}))
          PY
        env:
          ELEGIDA: ${{ github.event_name == 'workflow_dispatch' && inputs.plataforma || '' }}
          REF: ${{ github.ref }}

  build:
    needs: preparar
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    # Sin este límite, un paso colgado consume el máximo de 6 h de GitHub antes de
    # darse por vencido. Con 75 min, si algo se atasca falla pronto y se ve el log.
    timeout-minutes: 75
    strategy:
      fail-fast: false   # que un sistema falle no debe cancelar los demás
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # mejor disponibilidad de wheels geoespaciales
          cache: pip

      - name: Instalar dependencias
        shell: bash
        timeout-minutes: 30      # si un paquete se compila desde el código, no eternizarlo
        run: |
          python -m pip install --upgrade pip wheel
          # requirements.txt fija la versión EXACTA de scikit-learn con la que se
          # guardaron los modelos .joblib: si no coincide, al cargarlos las
          # predicciones pueden ser inválidas (aviso InconsistentVersionWarning).
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Comprobar que los modelos cargan sin aviso de versión
        shell: bash
        run: |
          python - <<'PY'
          import warnings, sys, glob
          from sklearn.exceptions import InconsistentVersionWarning
          fallos = []
          for f in sorted(glob.glob('*.joblib')):
              with warnings.catch_warnings(record=True) as w:
                  warnings.simplefilter('always')
                  import joblib; joblib.load(f)
                  if [x for x in w if issubclass(x.category, InconsistentVersionWarning)]:
                      fallos.append(f)
              print(('AVISO DE VERSION  ' if f in fallos else 'ok                ') + f)
          if fallos:
              sys.exit('ERROR: modelos incompatibles con esta scikit-learn: ' + ', '.join(fallos))
          PY

      - name: Compilar con PyInstaller
        shell: bash
        timeout-minutes: 30
        run: pyinstaller borreguil.spec --noconfirm --distpath dist --workpath build

      # Comprueba DENTRO del ejecutable que no falta ninguna dependencia ni recurso.
      # Imprescindible: el servidor web devuelve 200 aunque el script de la app
      # falle, así que una simple comprobación HTTP daría por bueno un binario roto.
      - name: Autodiagnóstico del ejecutable
        shell: bash
        timeout-minutes: 10
        run: |
          cd dist/Borreguil
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=./Borreguil.exe; else EXE=./Borreguil; fi
          "$EXE" --selftest

      - name: Comprobar que arranca y sirve la interfaz
        shell: bash
        timeout-minutes: 10
        env:
          BORREGUIL_NO_BROWSER: '1'
        run: |
          cd dist/Borreguil
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=./Borreguil.exe; else EXE=./Borreguil; fi
          # La salida va a un fichero y la entrada se cierra: si el proceso en
          # segundo plano conservara la tubería del runner, el paso no terminaría
          # nunca y agotaría el tiempo máximo del trabajo.
          "$EXE" < /dev/null > salida.log 2>&1 &
          PID=$!
          CODE=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:8501/_stcore/health || true)
            [ "$CODE" = "200" ] && break
            kill -0 $PID 2>/dev/null || { echo "El programa terminó antes de tiempo"; break; }
            sleep 3
          done
          echo "----- salida del programa -----"; cat salida.log || true
          # Matar el proceso y cualquier hijo que haya podido dejar vivo.
          kill -9 $PID 2>/dev/null || true
          pkill -9 -f Borreguil 2>/dev/null || true
          taskkill //F //IM Borreguil.exe 2>/dev/null || true
          if [ "$CODE" != "200" ]; then echo "ERROR: el servidor no respondió (HTTP $CODE)"; exit 1; fi
          if grep -qiE "traceback|ModuleNotFoundError|ImportError" salida.log; then
            echo "ERROR: se detectaron errores en el arranque (ver salida arriba)"; exit 1
          fi
          echo "OK: el servidor respondió y no hubo errores"

      - name: Empaquetar (zip / tar.gz)
        shell: bash
        run: |
          cd dist
          rm -f Borreguil/salida.log
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf "../${{ matrix.artefacto }}.tar.gz" Borreguil
          else
            7z a -tzip "../${{ matrix.artefacto }}.zip" Borreguil >/dev/null || \
              (command -v zip >/dev/null && zip -qr "../${{ matrix.artefacto }}.zip" Borreguil)
          fi

      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: |
            ${{ matrix.artefacto }}.zip
            ${{ matrix.artefacto }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar a la Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artefacto }}.zip
            ${{ matrix.artefacto }}.tar.gz
          fail_on_unmatched_files: false
          body: |
            ## Descargas

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 | `Borreguil-windows.zip` |
            | macOS Apple Silicon (M1-M4) | `Borreguil-macos-arm64.zip` |
            | macOS Intel | `Borreguil-macos-intel.zip` |
            | Linux x86-64 | `Borreguil-linux.tar.gz` |

            No requieren instalar Python ni ninguna librería: se descomprimen y se ejecutan.
            Consulta el **TUTORIAL.md** para los primeros pasos y el **MANUAL.md** como referencia.

            > La primera vez, Windows y macOS avisan de que el programa no está firmado
            > (es normal en software científico): ver la sección de instalación del tutorial.
